    <script>
      // Ensure window.fetch has both getter and setter so inspector/extension tools can safely monkey-patch it
      (function() {
        try {
          var originalFetch = window.fetch;
          if (typeof originalFetch === 'function') {
            var _fetch = originalFetch;
            var descriptor = {
              get: function() { return _fetch; },
              set: function(fn) { _fetch = fn; },
              configurable: true,
              enumerable: true
            };
            try {
              Object.defineProperty(window, 'fetch', descriptor);
            } catch (_) {
              try {
                Object.defineProperty(Object.getPrototypeOf(window), 'fetch', descriptor);
              } catch (_) {}
            }
          }
        } catch (_) {}
      })();
    </script>
